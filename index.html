function trans(n){clearTimeout(tt);clearInterval(timer);let i;do{i=R(LINES.length)}while(i==last);last=i;app.innerHTML=`<div class="s" style="background:var(--nud);justify-content:center">${W('spin','width:200px;margin:0')}<p class="sub" style="margin:26px 0 0;font-size:20px;max-width:300px">${LINES[i]}…</p></div>`;tt=setTimeout(()=>go(n,1),2400)}
const act={
home:()=>go('home'),how:()=>go('how'),sub:()=>go('sub'),
cats:()=>{players=1;trans('cats')},num:()=>trans('num'),
next:()=>{players++;go('cats')},
pick:t=>{app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o==t));$('#nx').disabled=false},
roll:()=>{clearInterval(timer);const e=$('#nv'),t0=Date.now();$('#nb').innerHTML='';$('#nt').textContent='Rolling…';e.className='go';
 (function spin(){const p=(Date.now()-t0)/3000;if(p>=1){e.textContent=1+R(10);e.className='pop';$('#nt').textContent='Show the group. Guesser, eyes closed!';$('#nb').innerHTML=B('Get A New Number','','roll').replace('class="btn"','class="btn sm"');return}e.textContent=1+R(10);setTimeout(spin,60+p*140)})()},
send:async()=>{const have=new Set(all().map(c=>c.toLowerCase()));
 const items=[...new Set([...app.querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean))].filter(c=>!have.has(c.toLowerCase()));
 if(![...app.querySelectorAll('input')].some(i=>i.value.trim())){$('#sm').textContent='Type at least one category first.';return}
 try{await ready;if(F.db)for(const text of items)await F.addDoc(F.collection(F.db,'submissions'),{text,status:'waiting',created:F.serverTimestamp()});go('thanks')}
 catch(e){$('#sm').textContent='Couldn’t send that. Try again in a moment.'}},
admin:()=>{app.insertAdjacentHTML('beforeend',`<div class="ov" id="ov"><div class="box dk" style="padding:24px 16px;margin:0"><p class="sub" style="font-size:24px;margin:0">Are You The</p><h1 class="hd">Master Of Infinity?</h1><div class="btn"><input id="pw" type="password" placeholder="What’s The Password Then?" style="border:0;padding:0;margin:0;font-size:16px">${IC(1).replace('<img','<img data-a="login"')}</div><p class="sub" id="pm" style="margin:4px 0 0;min-height:20px"></p><button class="btn" data-a="close" style="font:800 16px WS">Oh, no, I’m terribly sorry, take me back.${IC(1)}</button></div></div>`);$('#pw').focus();$('#pw').onkeydown=e=>{if(e.key=='Enter')act.login()}},
close:()=>$('#ov').remove(),
login:async()=>{const m=$('#pm');try{await ready;if(!F.auth)throw 0;await F.signInWithEmailAndPassword(F.auth,ADMIN_EMAIL,$('#pw').value);
 const s=await F.getDocs(F.query(F.collection(F.db,'submissions'),F.where('status','==','waiting')));
 Q=s.docs.map(d=>({id:d.id,text:d.data().text,st:'waiting',t:d.data().created?.seconds||0})).sort((a,b)=>a.t-b.t);go('admin')}
 catch(e){m.textContent=F.auth?'Nope. Try again, Master?':'Firebase isn’t connected yet.';const b=$('#ov .box');b.classList.remove('sh');void b.offsetWidth;b.classList.add('sh')}},
cyc:t=>{const r=Q[t.dataset.i];r.st=ST[(ST.indexOf(r.st)+1)%3];go('admin')},
commit:async()=>{if(busy)return;busy=1;const c={approved:0,rejected:0,waiting:0};try{for(const r of Q){const ref=F.doc(F.db,'submissions',r.id),text=r.text.trim().slice(0,100);
 if(r.st=='approved')await F.updateDoc(ref,{status:'approved',text});else if(r.st=='rejected')await F.updateDoc(ref,{status:'rejected'});else await F.updateDoc(ref,{text});c[r.st]++}
 await load();await F.signOut(F.auth)}catch(e){console.warn(e);busy=0;const m=$('#ce');if(m)m.textContent='Something went wrong. Nothing was lost, try again.';return}
 busy=0;Q=[];app.innerHTML=`<div class="s dk" style="justify-content:center"><h1 class="hd">All Processed!</h1><p class="sub" style="font-size:18px">${c.approved} approved, ${c.rejected} rejected${c.waiting?`, ${c.waiting} still waiting`:''}.</p><p class="sub" style="opacity:.7">Heading home…</p></div>`;setTimeout(()=>go('home',1),3000)}};
app.onclick=e=>{const t=e.target.closest('[data-a]');if(t&&act[t.dataset.a])act[t.dataset.a](t)};
app.oninput=e=>{const i=e.target.dataset.i;if(Q[i]&&e.target.closest('.row'))Q[i].text=e.target.value};
intro=1;go('home');
</script></body></html>
